<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中南点点 · 演示入口</title>
  <link rel="icon" href="assets/pc/logo.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
      color: #1e323f; background: #eaf3ff; min-height: 100vh; font-size: 14px;
    }
    button { font: inherit; cursor: pointer; }
    .topbar {
      height: 56px; display: flex; align-items: center; gap: 12px;
      padding: 0 24px; background: #fff; border-bottom: 1px solid #d7e6f5;
    }
    .topbar img { width: 32px; height: 32px; }
    .topbar h1 { font-size: 16px; font-weight: 700; letter-spacing: .5px; }
    .topbar p { font-size: 12px; color: #627079; margin-top: 1px; }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 20px 24px 40px; }
    .lead { font-size: 14px; line-height: 1.7; margin-bottom: 16px; }
    .lead span { color: #627079; }
    .roles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .card {
      background: #fff; border: 1px solid #d5e6f4; border-radius: 8px; padding: 16px 18px 14px;
    }
    .card--wide { grid-column: 1 / -1; }
    .card__role { font-size: 12px; font-weight: 600; color: #3087cc; }
    .card h2 { font-size: 18px; font-weight: 700; margin: 4px 0 2px; }
    .card__meta { font-size: 13px; color: #627079; }
    .card > p { color: #627079; font-size: 13px; line-height: 1.7; margin: 8px 0 12px; }
    .ports { display: flex; flex-wrap: wrap; gap: 8px; }
    .port {
      height: 32px; padding: 0 14px; border-radius: 4px; border: 1px solid #3087cc;
      background: #fff; color: #3087cc; font-size: 13px; font-weight: 600;
    }
    .port:hover { background: #f2f9fe; }
    .port--primary {
      border-color: transparent; color: #fff;
      background: linear-gradient(90deg, #469fff, #065cf8);
    }
    .port--primary:hover { filter: brightness(1.05); background: linear-gradient(90deg, #469fff, #065cf8); }
    .foot { margin-top: 16px; display: flex; align-items: center; gap: 12px; color: #627079; font-size: 13px; }
    .foot button {
      height: 30px; padding: 0 12px; border-radius: 4px; border: 1px solid #f3c2c2;
      background: #fff; color: #d35656; font-size: 13px;
    }
    .foot button:hover { background: #fff6f6; }
    @media (max-width: 760px) {
      .roles { grid-template-columns: 1fr; }
      .card--wide { grid-column: auto; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <img src="assets/pc/logo.svg" alt="">
    <div><h1>中南点点</h1><p>演示入口</p></div>
  </header>
  <main class="wrap">
    <p class="lead">点角色端口会以该身份打开对应首页。<span>三端共用本机演示数据。到首页后再自己点进失物或后台。</span></p>
    <div class="roles" id="roles"></div>
    <div class="foot"><button type="button" id="reset">重置演示数据</button><span>恢复初始演示数据，已在浏览器里改过的内容会清掉。</span></div>
  </main>
  <script src="js/store.js"></script>
  <script>
    var ROLES = [
      {
        id: 'u101', role: '普通学生',
        fit: '适合看认领进度、自己的寻物，以及同学发来的线索。她发布了寻物「白色耳机盒」，也提交过认领申请。',
        ports: [
          { port: 'h5', label: '移动端 · 首页', primary: true },
          { port: 'pc', label: 'PC 前台 · 首页' }
        ]
      },
      {
        id: 'u103', role: '普通学生',
        fit: '适合演示给别人的寻物提供线索。从首页进入失物招领，可以找到林知夏发布的寻物「白色耳机盒」。',
        ports: [
          { port: 'h5', label: '移动端 · 首页', primary: true },
          { port: 'pc', label: 'PC 前台 · 首页' }
        ]
      },
      {
        id: 'u_zz1', role: '资助团队 · 登记 + 核对',
        fit: '可以登记物品，也可以核对称认领、安排交接。负责岳麓山校区、天心校区、开福校区、毓秀楼、雷锋岗。管理端侧栏只有「失物招领」。',
        ports: [
          { port: 'h5', label: '移动端 · 首页' },
          { port: 'pc', label: 'PC 前台 · 首页' },
          { port: 'admin', label: 'PC 管理端 · 首页', primary: true }
        ]
      },
      {
        id: 'u_zz2', role: '资助团队 · 仅潇湘校区登记',
        fit: '只能登记潇湘校区服务点的物品，不能核对称认领。管理端台账只显示潇湘校区服务点保管的物品。',
        ports: [
          { port: 'h5', label: '移动端 · 首页' },
          { port: 'pc', label: 'PC 前台 · 首页' },
          { port: 'admin', label: 'PC 管理端 · 首页', primary: true }
        ]
      },
      {
        id: 'u_admin', role: '超级管理员', wide: true,
        fit: '可以进入全部后台，包括用户管理和「失物招领」。前台用来对照学生看到的页面。',
        ports: [
          { port: 'admin', label: 'PC 管理端 · 首页', primary: true },
          { port: 'pc', label: 'PC 前台 · 首页' }
        ]
      }
    ];

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function dest(port) {
      if (port === 'h5') return 'h5.html#/ywViews/bbs/home/index';
      if (port === 'pc') return 'pc.html#/bbs/home/index';
      if (port === 'admin') return 'pc.html#/bbs/admin/dashboard/index';
      return 'index.html';
    }
    function render() {
      document.getElementById('roles').innerHTML = ROLES.map(function (r) {
        var u = Store.user(r.id) || { nc: r.id, xm: '', xh: '' };
        return '<section class="card' + (r.wide ? ' card--wide' : '') + '">' +
          '<div class="card__role">' + esc(r.role) + '</div>' +
          '<h2>' + esc(u.nc) + '</h2>' +
          '<div class="card__meta">' + esc(u.xm) + ' · ' + esc(u.xh) + '</div>' +
          '<p>' + esc(r.fit) + '</p>' +
          '<div class="ports">' + r.ports.map(function (p) {
            return '<button type="button" class="port' + (p.primary ? ' port--primary' : '') + '" data-uid="' + esc(r.id) + '" data-port="' + esc(p.port) + '">' + esc(p.label) + '</button>';
          }).join('') + '</div></section>';
      }).join('');
    }
    document.getElementById('roles').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-uid]');
      if (!b) return;
      Store.setCurrentUser(b.getAttribute('data-uid'));
      location.href = dest(b.getAttribute('data-port'));
    });
    document.getElementById('reset').addEventListener('click', function () {
      if (window.confirm('将清空本机修改并恢复初始演示数据，是否继续？')) Store.reset();
    });
    render();
  </script>
</body>
</html>
